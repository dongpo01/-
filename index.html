<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>谈吐素养 · 经典训练系统</title>
  <style>
    :root {
      --primary: #1a365d;
      --primary-light: #2b6cb0;
      --accent: #c53030;
      --bg: #f7fafc;
      --card: #ffffff;
      --text: #1a202c;
      --text-secondary: #4a5568;
      --border: #e2e8f0;
      --success: #276749;
      --warning: #c05621;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header h1 span {
      font-weight: 300;
      opacity: 0.85;
      font-size: 0.95rem;
      margin-left: 0.6rem;
    }

    nav {
      display: flex;
      gap: 0.5rem;
    }

    nav button {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    nav button:hover, nav button.active {
      background: white;
      color: var(--primary);
    }

    /* Main Layout */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
      color: var(--primary);
    }

    .subtitle {
      color: var(--text-secondary);
      margin-bottom: 1.8rem;
      font-size: 0.95rem;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.1);
    }

    .card .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #ebf4ff;
      color: var(--primary-light);
      margin-right: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .card .tag.diff-初级 { background: #c6f6d5; color: var(--success); }
    .card .tag.diff-中级 { background: #fefcbf; color: #975a16; }
    .card .tag.diff-高级 { background: #fed7d7; color: var(--accent); }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .card .meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.8rem;
    }

    /* Material Detail Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: white;
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal .close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .modal h3 {
      font-size: 1.25rem;
      margin-bottom: 0.8rem;
      color: var(--primary);
      padding-right: 2rem;
    }

    .modal .field {
      margin-bottom: 1rem;
    }

    .modal .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    .modal .field p {
      font-size: 0.95rem;
    }

    .modal .original {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--primary);
      line-height: 1.5;
      background: #f0f5ff;
      padding: 0.9rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .filters select, .filters input {
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
    }

    .filters input { min-width: 200px; }

    /* Practice Area */
    .practice-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.8rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .practice-card h3 {
      font-size: 1.2rem;
      margin-bottom: 0.6rem;
    }

    .practice-card .context {
      background: #f7fafc;
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
      font-size: 0.95rem;
      border-left: 4px solid var(--primary-light);
    }

    .materials-list {
      margin: 1rem 0;
    }

    .materials-list li {
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }

    .materials-list code {
      background: #edf2f7;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      resize: vertical;
      font-family: inherit;
      margin-top: 0.8rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(43,108,176,0.15);
    }

    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--primary-light); }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { border-color: var(--primary-light); color: var(--primary-light); }

    .btn-group {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    /* Feedback Panel */
    .feedback-panel {
      display: none;
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: #f0fff4;
      border-radius: var(--radius);
      border: 1px solid #9ae6b4;
    }

    .feedback-panel.show { display: block; animation: fadeIn 0.3s; }

    .score-big {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--success);
      margin-bottom: 0.3rem;
    }

    .radar-placeholder {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    .dim-score {
      background: white;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .dim-score strong { color: var(--primary); }

    .feedback-list {
      margin-top: 1rem;
    }

    .feedback-list h4 {
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-secondary);
    }

    .feedback-list ul {
      padding-left: 1.2rem;
      font-size: 0.9rem;
    }

    /* Dashboard */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.3rem;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .stat-card .num {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    /* Empty / Loading */
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 640px) {
      header { flex-direction: column; gap: 0.8rem; padding: 1rem; }
      nav { width: 100%; justify-content: center; flex-wrap: wrap; }
      main { padding: 1.2rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>谈吐素养 <span>经典训练系统</span></h1>
    <nav>
      <button class="nav-btn active" data-section="dashboard">总览</button>
      <button class="nav-btn" data-section="materials">素材库</button>
      <button class="nav-btn" data-section="practice">开始练习</button>
      <button class="nav-btn" data-section="history">练习记录</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard -->
    <section id="dashboard" class="section active">
      <h2>训练总览</h2>
      <p class="subtitle">以经典为根基，系统提升谈吐素养与口才</p>

      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="stat-materials">274</div>
          <div class="label">经典素材</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-exercises">31</div>
          <div class="label">练习题</div>
        </div>
        <div class="stat-card">
          <div class="num">6</div>
          <div class="label">能力维度</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-done">0</div>
          <div class="label">已完成练习</div>
        </div>
      </div>

      <h3 style="margin-bottom:1rem;font-size:1.15rem;">能力雷达（示例）</h3>
      <div class="radar-placeholder" id="radar-demo">
        <div class="dim-score">素材调用 <strong>78</strong></div>
        <div class="dim-score">结构完整 <strong>72</strong></div>
        <div class="dim-score">语境适配 <strong>81</strong></div>
        <div class="dim-score">修辞表现 <strong>65</strong></div>
        <div class="dim-score">思维深度 <strong>70</strong></div>
        <div class="dim-score">表达流畅 <strong>85</strong></div>
      </div>

      <div style="margin-top:2rem;">
        <h3 style="margin-bottom:0.8rem;font-size:1.15rem;">推荐练习</h3>
        <div class="grid" id="recommend-grid"></div>
      </div>
    </section>

    <!-- Materials -->
    <section id="materials" class="section">
      <h2>经典素材库</h2>
      <p class="subtitle">274 条精选素材，支持按场景、难度、类别筛选</p>

      <div class="filters">
        <select id="filter-category">
          <option value="">全部类别</option>
          <option value="古诗词金句">古诗词金句</option>
          <option value="典故与成语">典故与成语</option>
          <option value="诸子百家与经典语录">诸子百家</option>
          <option value="史传与人物对话">史传对话</option>
          <option value="全球经典名言">全球经典</option>
          <option value="专项补充">专项补充</option>
        </select>
        <select id="filter-scene">
          <option value="">全部场景</option>
          <option value="职场谈吐">职场谈吐</option>
          <option value="演讲开场">演讲开场</option>
          <option value="演讲结尾">演讲结尾</option>
          <option value="辩论反驳">辩论反驳</option>
          <option value="激励鼓舞">激励鼓舞</option>
          <option value="劝慰安慰">劝慰安慰</option>
          <option value="社交闲谈">社交闲谈</option>
          <option value="自我介绍">自我介绍</option>
        </select>
        <select id="filter-diff">
          <option value="">全部难度</option>
          <option value="初级">初级</option>
          <option value="中级">中级</option>
          <option value="高级">高级</option>
        </select>
        <input type="text" id="filter-search" placeholder="搜索原文或出处..." />
      </div>

      <div class="grid" id="materials-grid"></div>
    </section>

    <!-- Practice -->
    <section id="practice" class="section">
      <h2>开始练习</h2>
      <p class="subtitle">选择一道题，按要求完成表达，获取即时反馈</p>

      <div class="filters">
        <select id="ex-filter-type">
          <option value="">全部类型</option>
          <option value="金句嵌入">金句嵌入</option>
          <option value="仿写改写">仿写改写</option>
          <option value="即兴发言">即兴发言</option>
          <option value="辩论反驳">辩论反驳</option>
          <option value="情境角色扮演">情境角色扮演</option>
          <option value="结构模板填充">结构模板填充</option>
          <option value="快速反应">快速反应</option>
        </select>
        <select id="ex-filter-diff">
          <option value="">全部难度</option>
          <option value="初级">初级</option>
          <option value="中级">中级</option>
          <option value="高级">高级</option>
        </select>
      </div>

      <div class="grid" id="exercises-grid"></div>

      <!-- Active Practice -->
      <div id="active-practice" style="display:none;">
        <div class="practice-card" id="practice-detail"></div>
        <div class="feedback-panel" id="feedback-panel"></div>
      </div>
    </section>

    <!-- History -->
    <section id="history" class="section">
      <h2>练习记录</h2>
      <p class="subtitle">本地保存最近练习（刷新后仍保留）</p>
      <div id="history-list" class="empty">暂无练习记录，去完成第一道题吧。</div>
    </section>
  </main>

  <!-- Material Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="close" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // ===================== 模拟数据（精简版，实际可 fetch JSON） =====================
    const MATERIALS = [
      {id:"P1-0001",category:"古诗词金句",original:"关关雎鸠，在河之洲。窈窕淑女，君子好逑。",source:"《诗经·周南·关雎》",meaning:"美好的追求与匹配，君子求贤配。",usage_example:"表达对理想对象或卓越人才的向往时可用。",difficulty:"初级",scenes:["社交闲谈","通用"],themes:["爱情","追求"]},
      {id:"P1-0007",category:"古诗词金句",original:"天行健，君子以自强不息。",source:"《周易·乾卦》",meaning:"天道刚健，君子应永不停息地自我提升。",usage_example:"激励持续奋斗、不懈怠的开场或结尾。",difficulty:"初级",scenes:["演讲开场","激励鼓舞","职场谈吐"],themes:["自强","奋斗"]},
      {id:"P1-0010",category:"古诗词金句",original:"满招损，谦受益。",source:"《尚书·大禹谟》",meaning:"自满招致损失，谦虚使人受益。",usage_example:"劝诫谦逊、反对骄傲的场合。",difficulty:"初级",scenes:["职场谈吐","演讲开场"],themes:["谦虚"]},
      {id:"P1-0014",category:"古诗词金句",original:"凡事豫则立，不豫则废。",source:"《礼记·中庸》",meaning:"事前准备充分则成功，否则失败。",usage_example:"强调规划与准备的重要性。",difficulty:"初级",scenes:["职场谈吐","演讲开场"],themes:["准备","规划"]},
      {id:"P1-0016",category:"古诗词金句",original:"路漫漫其修远兮，吾将上下而求索。",source:"屈原《离骚》",meaning:"道路漫长，仍要坚持探索。",usage_example:"表达对理想的执着追求。",difficulty:"初级",scenes:["演讲开场","激励鼓舞"],themes:["理想","探索"]},
      {id:"P1-0022",category:"古诗词金句",original:"桃李不言，下自成蹊。",source:"《史记·李将军列传》",meaning:"真正的价值无需自我宣传。",usage_example:"形容以实际行动赢得尊重。",difficulty:"初级",scenes:["职场谈吐","演讲开场"],themes:["实干"]},
      {id:"P1-0043",category:"古诗词金句",original:"天生我材必有用，千金散尽还复来。",source:"李白《将进酒》",meaning:"自信人生价值，不为物质所困。",usage_example:"鼓励自信与豁达。",difficulty:"初级",scenes:["激励鼓舞","演讲开场"],themes:["自信","豁达"]},
      {id:"P1-0044",category:"古诗词金句",original:"长风破浪会有时，直挂云帆济沧海。",source:"李白《行路难》",meaning:"总有乘风破浪的一天。",usage_example:"激励在困境中保持希望。",difficulty:"初级",scenes:["演讲结尾","激励鼓舞"],themes:["希望","奋斗"]},
      {id:"P1-0048",category:"古诗词金句",original:"会当凌绝顶，一览众山小。",source:"杜甫《望岳》",meaning:"站在巅峰俯视一切。",usage_example:"表达攀登高峰、超越自我的志向。",difficulty:"初级",scenes:["演讲开场","激励鼓舞"],themes:["志向","超越"]},
      {id:"P1-0056",category:"古诗词金句",original:"横看成岭侧成峰，远近高低各不同。",source:"苏轼《题西林壁》",meaning:"角度不同，所见不同。",usage_example:"说明立场与视角影响认知。",difficulty:"初级",scenes:["演讲开场","辩论反驳","职场谈吐"],themes:["视角","认知"]},
      {id:"P1-0057",category:"古诗词金句",original:"不识庐山真面目，只缘身在此山中。",source:"苏轼《题西林壁》",meaning:"当局者迷。",usage_example:"提醒跳出局部看整体。",difficulty:"初级",scenes:["演讲开场","辩论反驳"],themes:["认知","局限"]},
      {id:"P1-0060",category:"古诗词金句",original:"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。",source:"苏轼《定风波》",meaning:"从容面对风雨。",usage_example:"表达乐观与随遇而安。",difficulty:"中级",scenes:["激励鼓舞","劝慰安慰"],themes:["乐观","从容"]},
      {id:"P1-0071",category:"典故与成语",original:"破釜沉舟",source:"《史记·项羽本纪》",meaning:"下定决心，不留后路。",usage_example:"强调破釜沉舟的决心与全力以赴。",difficulty:"初级",scenes:["职场谈吐","激励鼓舞","辩论反驳"],themes:["决心","勇气"]},

    // ===================== 安全存储（兼容沙箱环境） =====================
    const safeStorage = (() => {
      let memoryStore = {};
      let available = false;
      try {
        const key = "__tantu_test__";
        window.localStorage.setItem(key, "1");
        window.localStorage.removeItem(key);
        available = true;
      } catch (e) {
        available = false;
      }
      return {
        get(key) {
          if (available) {
            try { return window.localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; }
          }
          return memoryStore[key] || null;
        },
        set(key, value) {
          if (available) {
            try { window.localStorage.setItem(key, value); return; } catch (e) {}
          }
          memoryStore[key] = value;
        }
      };
    })();

    // ===================== 素材库渲染 =====================
    function renderMaterials() {
      const cat = document.getElementById("filter-category").value;
      const scene = document.getElementById("filter-scene").value;
      const diff = document.getElementById("filter-diff").value;
      const q = document.getElementById("filter-search").value.trim().toLowerCase();

      const filtered = MATERIALS.filter(m => {
        if (cat && m.category !== cat) return false;
        if (scene && !(m.scenes || []).includes(scene)) return false;
        if (diff && m.difficulty !== diff) return false;
        if (q && !m.original.toLowerCase().includes(q) && !m.source.toLowerCase().includes(q)) return false;
        return true;
      });

      const grid = document.getElementById("materials-grid");
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">没有符合条件的素材</div>';
        return;
      }

      grid.innerHTML = filtered.map(m => `
        <div class="card" onclick="showMaterial('${m.id}')">
          <span class="tag">${m.category}</span>
          <span class="tag diff-${m.difficulty}">${m.difficulty}</span>
          <h3>${m.original}</h3>
          <div class="meta">${m.source}</div>
        </div>
      `).join("");
    }

    function showMaterial(id) {
      const m = MATERIALS.find(x => x.id === id);
      if (!m) return;
      document.getElementById("modal-body").innerHTML = `
        <div class="original">${m.original}</div>
        <div class="field"><label>出处</label><p>${m.source}</p></div>
        <div class="field"><label>核心意义</label><p>${m.meaning}</p></div>
        <div class="field"><label>谈吐用法</label><p>${m.usage_example}</p></div>
        <div class="field"><label>难度</label><p>${m.difficulty}</p></div>
        <div class="field"><label>适用场景</label><p>${(m.scenes || []).join("、") || "通用"}</p></div>
        <div class="field"><label>主题</label><p>${(m.themes || []).join("、")}</p></div>
      `;
      document.getElementById("modal").classList.add("show");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("show");
    }

    document.getElementById("modal").addEventListener("click", e => {
      if (e.target === document.getElementById("modal")) closeModal();
    });

    ["filter-category","filter-scene","filter-diff","filter-search"].forEach(id => {
      document.getElementById(id).addEventListener("input", renderMaterials);
    });

    // ===================== 简易自动评分（演示） =====================
    function submitAnswer() {
      const text = document.getElementById("user-answer").value.trim();
      if (!text) {
        alert("请先输入你的表达内容");
        return;
      }

      const ex = currentExercise;
      // 简单素材命中检测
      let hitCount = 0;
      const hits = [];
      ex.materials.forEach(m => {
        // 取原文关键部分做匹配
        const key = m.original.slice(0, 8);
        if (text.includes(key) || text.includes(m.original.slice(0, 4))) {
          hitCount++;
          hits.push(m.original);
        }
      });

      const materialScore = Math.min(100, 40 + hitCount * 30);
      const lengthScore = text.length > 30 ? (text.length < 600 ? 85 : 70) : 50;
      const structureScore = /因此|所以|总之|综上所述|我认为|首先|其次|最后/.test(text) ? 80 : 60;
      const overall = Math.round(materialScore * 0.35 + lengthScore * 0.3 + structureScore * 0.35);

      const highlights = [];
      const improvements = [];

      if (hitCount >= 2) highlights.push(`成功使用了 ${hitCount} 条指定素材：${hits.join("；")}`);
      else if (hitCount === 1) highlights.push(`使用了素材「${hits[0]}」`);
      else improvements.push("未检测到指定素材的使用，建议自然嵌入至少1-2条经典表述");

      if (text.length > 80) highlights.push("表达内容较为充实");
      else improvements.push("内容偏短，可尝试展开论证或增加具体例子");

      if (structureScore >= 80) highlights.push("出现了较清晰的逻辑连接词，结构意识良好");
      else improvements.push("可增加「首先/其次/总之」等结构词，让层次更清晰");

      if (overall >= 75) improvements.push("整体不错，可进一步打磨素材与上下文的过渡，让引用更自然");
      else improvements.push("建议先明确中心观点，再围绕观点选择最贴切的素材");

      // 显示反馈
      const panel = document.getElementById("feedback-panel");
      panel.innerHTML = `
        <div class="score-big">${overall}</div>
        <div style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:0.8rem;">综合得分（演示版自动评分）</div>
        <div class="radar-placeholder">
          <div class="dim-score">素材调用 <strong>${materialScore}</strong></div>
          <div class="dim-score">结构完整 <strong>${structureScore}</strong></div>
          <div class="dim-score">表达充实 <strong>${lengthScore}</strong></div>
        </div>
        <div class="feedback-list">
          <h4>亮点</h4>
          <ul>${highlights.map(h => `<li>${h}</li>`).join("") || "<li>继续加油</li>"}</ul>
          <h4 style="margin-top:0.8rem;">可提升</h4>
          <ul>${improvements.map(i => `<li>${i}</li>`).join("")}</ul>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="saveHistory(${overall})">保存记录</button>
          <button class="btn btn-outline" onclick="backToList()">返回题目列表</button>
        </div>
      `;
      panel.classList.add("show");

      // 更新统计
      document.getElementById("stat-done").textContent = history.length + 1;
    }

    function saveHistory(score) {
      history.unshift({
        id: currentExercise.id,
        title: currentExercise.title,
        type: currentExercise.type,
        score,
        time: new Date().toLocaleString("zh-CN")
      });
      if (history.length > 50) history = history.slice(0, 50);
      safeStorage.set("tantu_history", JSON.stringify(history));
      document.getElementById("stat-done").textContent = history.length;
      alert("已保存到练习记录");
    }

    function renderHistory() {
      const el = document.getElementById("history-list");
      if (!history.length) {
        el.className = "empty";
        el.innerHTML = "暂无练习记录，去完成第一道题吧。";
        return;
      }
      el.className = "";
      el.innerHTML = history.map(h => `
        <div class="card" style="cursor:default;margin-bottom:0.8rem;">
          <span class="tag">${h.type}</span>
          <h3 style="font-size:1rem;">${h.title}</h3>
          <div class="meta">得分：<strong style="color:var(--primary)">${h.score}</strong> · ${h.time}</div>
        </div>
      `).join("");
    }

    // ===================== 推荐练习 =====================
    function renderRecommend() {
      const grid = document.getElementById("recommend-grid");
      const recs = EXERCISES.slice(0, 3);
      grid.innerHTML = recs.map(ex => `
        <div class="card" onclick="document.querySelector('[data-section=practice]').click(); setTimeout(()=>startPractice('${ex.id}'),100)">
          <span class="tag">${ex.type}</span>
          <span class="tag diff-${ex.difficulty}">${ex.difficulty}</span>
          <h3>${ex.title}</h3>
          <div class="meta">${ex.scene}</div>
        </div>
      `).join("");
    }

    // ===================== 初始化 =====================
    renderMaterials();
    renderExercises();
    renderRecommend();
    document.getElementById("stat-done").textContent = history.length;
  </script>
</body>
</html>
